name: "react-sample-ci-cd"

on: 
    push:
        branches:
            - master
            - test

jobs:
    build-and-test:
        runs-on: ubuntu-latest

        steps:
          - name: "setup node js"
            uses: actions/setup-node@v4
            with: 
              node-version: "24"

          - name: "check node version"
            run: node --version
          
          - name: "clone the repository"
            uses: actions/checkout@v2
          
          - name: "list directories"
            run: ls
          
          - name: "install node modules"
            run: npm install
          
          - name: "list directories"
            run: ls